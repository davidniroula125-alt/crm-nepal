<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#122a4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark blue rounded rectangle -->
  <rect x="0" y="0" width="280" height="90" rx="14" ry="14" fill="url(#bg)"/>
  <!-- CRM - bold white, left side -->
  <text x="20" y="62" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="2">CRM</text>
  <!-- SOFTWARE - small white, upper right -->
  <text x="140" y="38" font-family="'Arial', 'Helvetica Neue', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="4">SOFTWARE</text>
  <!-- NEPAL - red, lower right -->
  <text x="140" y="66" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-weight="900" font-size="28" fill="#DC3545" letter-spacing="2">NEPAL</text>
</svg>
